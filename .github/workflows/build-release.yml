name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version matching AppVersion.cs, e.g. v3.0.1; empty means build only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve source and release versions
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $taskSource = [IO.File]::ReadAllText((Join-Path $pwd 'AppVersion.cs'))
          $taskMatch = [regex]::Match($taskSource, 'Number\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $taskMatch.Success) { throw 'Cannot read source version.' }
          $taskExpected = 'v' + $taskMatch.Groups[1].Value
          $taskTag = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $taskTag = $env:GITHUB_REF_NAME }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $taskRequested = [string]$env:REQUESTED_TAG; $taskTag = $taskRequested.Trim() }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -eq 'main') { $taskTag = $taskExpected }
          if ($taskTag -and $taskTag -ne $taskExpected) { throw "Release tag must match source version $taskExpected." }
          "release_tag=$taskTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_dir=dist/release/$taskExpected" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and run offline checks
        run: .\test.ps1
      - name: Package source version
        run: .\package.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ${{ steps.version.outputs.package_dir }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: needs.build.outputs.release_tag != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release
      - name: Verify download checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish version and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            release/CodexUsageWidget-Windows.exe \
            "release/codex-usage-widget-$RELEASE_TAG-windows-x64.zip" \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Codex Usage Widget $RELEASE_TAG" \
            --notes-file release/release-notes.md
